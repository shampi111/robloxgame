# Скопируйте этот файл в config.yaml и заполните.
# Строки, начинающиеся с #, — комментарии, бот их не читает.

telegram:
  # Токен бота от @BotFather (вида 123456789:AAE...)
  bot_token: "ВАШ_ТОКЕН_БОТА"
  # Куда слать уведомления. Свой chat id можно узнать у @userinfobot.
  # Только из этих чатов бот принимает команды (/interval, /pause и т.д.).
  chat_ids: [123456789]
  # Управление ботом командами из Telegram
  commands: true
  # proxy: "socks5://user:pass@host:port"   # если Telegram не работает у провайдера (http:// тоже можно)

monitor:
  # Как часто проверять сайты, в минутах (от 1 до 1440).
  # Можно менять прямо из Telegram командой /interval 10 — без перезапуска (см. README, раздел 4).
  interval_minutes: 5
  # При первом запуске и после изменения условий ниже бот только запоминает объявления,
  # которые уже висят на сайте, и присылает лишь новые. true — прислать и все текущие подходящие.
  notify_on_first_run: false
  # Прислать повторное уведомление, если подходящее объявление подешевело.
  notify_price_drop: true
  # …но только если цена упала хотя бы на столько процентов (чтобы не слать про копейки).
  min_price_drop_percent: 5
  # Не больше стольких отдельных уведомлений за одну проверку; остальные придут одним списком.
  max_notifications_per_cycle: 25
  # Файл, где бот помнит уже просмотренные объявления.
  state_file: state.json
  # proxy: "http://user:pass@host:port"     # прокси для запросов к FunPay и LolzMarket
  # Если FunPay показывает цены не в рублях (бот запущен не в России), они пересчитываются в рубли
  # по текущему курсу автоматически. Курс можно задать вручную — сколько рублей за 1 единицу:
  # currency_rates: {USD: 95, EUR: 103}

funpay:
  enabled: true
  # Раздел «Аккаунты» каждой игры: число из ссылки https://funpay.com/lots/<число>/ (можно вставить ссылку целиком).
  # auto — бот сам найдёт раздел «Аккаунты» на главной странице FunPay (если вдруг номер поменяется).
  categories:
    brawl_stars: 436      # https://funpay.com/lots/436/
    clash_royale: 149     # https://funpay.com/lots/149/
  # Пауза между запросами к FunPay, секунды. Не ставьте меньше 3–5: можно получить бан по IP.
  request_delay_seconds: 5
  # cookies: {}           # дополнительные cookie для FunPay (обычно не нужны; входить в аккаунт НЕ нужно)

lolz:
  enabled: true
  # Токен API LolzMarket с правом market: https://lolz.live/account/api (зеркала: lolz.team, zelenka.guru).
  # Для доступа к Market API нужно 200 симпатий на форуме или платная подписка.
  token: "ВАШ_ТОКЕН_LOLZ"
  base_url: https://api.lzt.market
  fallback_base_url: https://prod-api.lzt.market   # запасной адрес, если основной не отвечает
  item_url: "https://lzt.market/{id}/"              # как строить ссылку на объявление
  # Пауза между запросами к API, секунды (лимит поиска — от 20 до 120 запросов в минуту).
  request_delay_seconds: 3.5
  # Сколько страниц самых новых объявлений смотреть на каждое правило (на странице около 40 штук).
  pages: 1

# Условия. Объявление присылается, если подходит хотя бы под одно правило.
# Все поля, кроме name и game, необязательные — ненужное условие просто удалите.
rules:
  - name: "BS дешёвый с кубками"
    game: brawl_stars             # brawl_stars или clash_royale
    sites: [funpay, lolz]         # где искать
    price_max: 1500               # цена в рублях, включительно
    # price_min: 100
    trophies_min: 30000           # кубков не меньше
    # trophies_max: 60000
    brawlers_min: 60              # бравлеров не меньше (только Brawl Stars)
    # level_min: 150              # уровень аккаунта не меньше
    # Слова ищутся без учёта регистра, с начала слова: «аренд» найдёт «аренда», «аренду».
    # На FunPay — только в коротком тексте объявления из списка, на LolzMarket — в названии и описании.
    # include_all: ["почт"]       # должны быть ВСЕ эти слова
    # include_any: ["полный доступ", "родная почта"]   # хотя бы ОДНО из этих слов
    exclude: ["аренд"]            # НИ ОДНОГО из этих слов
    # На FunPay кубки/бравлеры берутся из текста объявления («35к кубков»). Если продавец их не указал:
    # false — пропустить такое объявление, true — всё равно прислать.
    allow_unknown: false
    # Только для FunPay: требования к продавцу
    # online_only: true           # продавец сейчас онлайн
    min_reviews: 5                # отзывов не меньше
    # min_rating: 4.5             # рейтинг не ниже (1–5; у продавцов меньше чем с 10 отзывами рейтинга нет)
    # Только для LolzMarket: любые параметры поиска API как есть (см. README)
    # lolz_params:
    #   origin: [personal, resale]
    #   legendary_brawlers_min: 5

  - name: "CR прокачанный"
    game: clash_royale
    sites: [funpay, lolz]
    price_max: 3000
    trophies_min: 7000
    level_min: 14                 # уровень короля
    exclude: ["аренд"]
